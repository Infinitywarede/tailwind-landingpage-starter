<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailwind-Landingpage-Starter auf Deutsch</title>
<meta name="description" content="Kostenlose Landingpage auf Deutsch mit Tailwind CSS 4. Elf Abschnitte, Dunkelmodus, MIT-Lizenz, ohne Build nutzbar.">
<link rel="stylesheet" href="dist/kit.css">
<script>
  /* Farbmodus vor dem ersten Zeichnen setzen, damit nichts flackert */
  (function () {
    var dunkel = window.matchMedia('(prefers-color-scheme: dark)').matches;
    try { var s = localStorage.getItem('farbmodus'); if (s) dunkel = s === 'dunkel'; } catch (e) {}
    document.documentElement.classList.toggle('dark', dunkel);
  })();
</script>
</head>
<body class="bg-white text-slate-700 antialiased dark:bg-slate-950 dark:text-slate-300">
<a href="#inhalt" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-slate-900 focus:shadow-lg">Zum Inhalt springen</a>
<button type="button" id="modus" aria-pressed="false" class="fixed bottom-4 right-4 z-50 rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-lg hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200 dark:focus-visible:outline-brand-400">Dunkelmodus</button>
<div class="bg-slate-900 px-6 py-3 text-center text-sm text-slate-200">Kostenloser Starter unter MIT-Lizenz. <a class="font-semibold text-white underline" href="https://github.com/Infinitywarede/tailwind-landingpage-starter">Code auf GitHub</a></div>
<main id="inhalt">
<!-- SECTIONS -->
</main>
<div class="border-t border-slate-200 bg-white px-6 py-6 text-center text-sm text-slate-600 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-400">Der Starter ist der freie Teil des <a class="font-semibold text-brand-600 underline dark:text-brand-300" href="https://vorlagerie.de/vorlagen/tailwind-ui-kit-landingpages">Tailwind-UI-Kits für Landingpages</a> mit 44 Abschnitten von Vorlagerie. <a class="underline" href="https://vorlagerie.de/impressum">Impressum</a> · <a class="underline" href="https://vorlagerie.de/datenschutz">Datenschutz</a></div>
<script>
  (function () {
    var knopf = document.getElementById('modus');
    function zeige() { knopf.setAttribute('aria-pressed', document.documentElement.classList.contains('dark') ? 'true' : 'false'); }
    knopf.addEventListener('click', function () {
      var dunkel = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('farbmodus', dunkel ? 'dunkel' : 'hell'); } catch (e) {}
      zeige();
    });
    zeige();
  })();
</script>
</body>
</html>
